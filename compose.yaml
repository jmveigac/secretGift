services:
  web:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      APP_MODE: ${APP_MODE:-}
      TEST_EMAIL: ${TEST_EMAIL:-}
      FROM: ${FROM:-}
      HOST: ${HOST:-}
      PORT: ${PORT:-}
      MAILUSER: ${MAILUSER:-}
      MAILPWD: ${MAILPWD:-}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-15}
    volumes:
      - local-data:/app/data
      - local-keys:/app/keys
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  local-data:
  local-keys:
